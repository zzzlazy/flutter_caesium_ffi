name: flutter_caesium_ffi
description: Fast cross-platform image compression powered by libcaesium through Dart FFI and WebAssembly.
version: 1.0.1
homepage: https://github.com/zzzlazy/flutter_caesium_ffi
repository: https://github.com/zzzlazy/flutter_caesium_ffi
issue_tracker: https://github.com/zzzlazy/flutter_caesium_ffi/issues

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  ffi: ^2.1.2
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  ffigen: ^11.0.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      web:
        pluginClass: FlutterCaesiumFfiWeb
        fileName: src/flutter_caesium_ffi_web.dart
      windows:
        ffiPlugin: true
  assets:
    - web/libcaesium_wasm/index.js
    - web/libcaesium_wasm/libcaesium_wasm.wasm
