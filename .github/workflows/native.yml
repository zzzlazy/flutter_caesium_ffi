name: Native CI

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
  pull_request:
    paths:
      - 'rust/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.22.2
  RUST_VERSION: 1.92.0

jobs:
  native-quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - run: flutter pub get
      - run: cargo +${{ env.RUST_VERSION }} fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +${{ env.RUST_VERSION }} clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +${{ env.RUST_VERSION }} test --manifest-path rust/Cargo.toml
      - name: Verify generated bindings
        run: |
          cp lib/src/flutter_caesium_ffi_bindings_generated.dart "$RUNNER_TEMP/bindings.dart"
          dart run ffigen --config ffigen.yaml
          diff -u "$RUNNER_TEMP/bindings.dart" lib/src/flutter_caesium_ffi_bindings_generated.dart

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - name: Link bundled macOS library without rebuilding native code
        run: flutter build macos --debug
        working-directory: example
      - name: Link bundled iOS library without rebuilding native code
        run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: dart run tool/build_native.dart --platform all-apple
      - name: Test native bridge
        run: |
          host_target=$(rustc +${RUST_VERSION} -vV | sed -n 's/^host: //p')
          FLUTTER_CAESIUM_FFI_LIBRARY="${GITHUB_WORKSPACE}/rust/target/${host_target}/release/libflutter_caesium_ffi.dylib" \
            flutter test test/native_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: native-apple
          path: |
            ios/Frameworks/flutter_caesium_ffi.xcframework
            macos/Frameworks/flutter_caesium_ffi.xcframework
          if-no-files-found: error

  linux-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - name: Link bundled Linux library without rebuilding native code
        run: flutter build linux --debug
        working-directory: example
      - name: Link bundled Android libraries without rebuilding native code
        run: flutter build apk --debug
        working-directory: example
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install native rebuild tools
        run: |
          cargo +${RUST_VERSION} install cargo-ndk --version 3.5.4 --locked
          cargo +${RUST_VERSION} install cargo-zigbuild --version 0.20.1 --locked
      - run: dart run tool/build_native.dart --platform linux
        env:
          FLUTTER_CAESIUM_LINUX_GLIBC: '2.31'
      - name: Verify Linux glibc baseline
        run: |
          highest=$(readelf --version-info native/linux/x64/libflutter_caesium_ffi.so |
            grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          test "$(printf '%s\n' "$highest" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
      - run: dart run tool/build_native.dart --platform android
      - name: Test native bridge
        env:
          FLUTTER_CAESIUM_FFI_LIBRARY: ${{ github.workspace }}/native/linux/x64/libflutter_caesium_ffi.so
        run: flutter test test/native_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-android
          path: |
            native/android
            native/linux
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Link bundled Windows library without rebuilding native code
        run: flutter build windows --debug
        working-directory: example
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - run: dart run tool/build_native.dart --platform windows
      - name: Test native bridge
        shell: pwsh
        run: |
          $env:FLUTTER_CAESIUM_FFI_LIBRARY = "${{ github.workspace }}\native\windows\x64\flutter_caesium_ffi.dll"
          flutter test test/native_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native/windows
          if-no-files-found: error

  package:
    needs: [native-quality, apple, linux-android, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-apple
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-android
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native/windows
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
      - name: Create and enforce package size limits
        run: |
          archive="$RUNNER_TEMP/flutter_caesium_ffi-1.0.1.tar.gz"
          tar --exclude-vcs --exclude-from=.pubignore -czf "$archive" .
          compressed=$(stat -c %s "$archive")
          unpacked=$(tar -tzvf "$archive" | awk '{sum += $3} END {print sum}')
          test "$compressed" -lt 104857600
          test "$unpacked" -lt 268435456
          cp "$archive" .
      - uses: actions/upload-artifact@v4
        with:
          name: flutter_caesium_ffi-1.0.1-package
          path: flutter_caesium_ffi-1.0.1.tar.gz
          if-no-files-found: error
