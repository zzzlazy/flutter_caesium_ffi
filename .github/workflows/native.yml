name: Native CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/native.yml'
      - 'hook/**'
      - 'lib/src/flutter_caesium_ffi_bindings_generated.dart'
      - 'lib/src/native_api.dart'
      - 'native/**'
      - 'rust/**'
      - 'src/**'
      - 'test/native_integration_test.dart'
      - 'tool/build_native.dart'
      - 'ffigen.yaml'
      - 'pubspec.yaml'
  pull_request:
    paths:
      - '.github/workflows/native.yml'
      - 'hook/**'
      - 'lib/src/flutter_caesium_ffi_bindings_generated.dart'
      - 'lib/src/native_api.dart'
      - 'native/**'
      - 'rust/**'
      - 'src/**'
      - 'test/native_integration_test.dart'
      - 'tool/build_native.dart'
      - 'ffigen.yaml'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.10
  RUST_VERSION: 1.92.0

jobs:
  native-quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - run: flutter pub get
      - run: cargo +${{ env.RUST_VERSION }} fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +${{ env.RUST_VERSION }} clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +${{ env.RUST_VERSION }} test --manifest-path rust/Cargo.toml
      - name: Verify generated @Native bindings
        run: |
          cp lib/src/flutter_caesium_ffi_bindings_generated.dart "$RUNNER_TEMP/bindings.dart"
          dart run ffigen --config ffigen.yaml
          diff -u "$RUNNER_TEMP/bindings.dart" lib/src/flutter_caesium_ffi_bindings_generated.dart

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - name: Test checked-in Native Asset without installing Rust
        run: flutter test test/native_integration_test.dart
      - name: Build macOS consumer without installing Rust
        run: flutter build macos --debug
        working-directory: example
      - name: Build iOS simulator consumer without installing Rust
        run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
      - name: Validate checked-in Apple Native Assets
        run: |
          for library in native/ios/*/*.dylib native/macos/*/*.dylib; do
            test "$(otool -D "$library" | tail -1)" = "@rpath/libflutter_caesium_ffi.dylib"
            ! otool -L "$library" | grep -F "$GITHUB_WORKSPACE"
            nm -gU "$library" | grep -q ' _fc_abi_version$'
            nm -gU "$library" | grep -q ' _fc_compress_memory$'
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: dart run tool/build_native.dart --platform all-apple
      - name: Test rebuilt Native Asset
        run: flutter test test/native_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: native-apple
          path: |
            native/ios
            native/macos
          if-no-files-found: error

  linux-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - name: Test checked-in Native Asset without installing Rust
        run: flutter test test/native_integration_test.dart
      - name: Build Linux consumer without installing Rust
        run: flutter build linux --debug
        working-directory: example
      - name: Build Android consumers without installing Rust
        run: |
          flutter build apk --debug
          flutter build apk --release
        working-directory: example
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install native rebuild tools
        run: |
          cargo +${RUST_VERSION} install cargo-ndk --version 3.5.4 --locked
          cargo +${RUST_VERSION} install cargo-zigbuild --version 0.20.1 --locked
      - run: dart run tool/build_native.dart --platform linux
        env:
          FLUTTER_CAESIUM_LINUX_GLIBC: '2.31'
      - name: Verify Linux Native Asset
        run: |
          highest=$(readelf --version-info native/linux/x64/libflutter_caesium_ffi.so |
            grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          test "$(printf '%s\n' "$highest" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
          readelf --wide --dyn-syms native/linux/x64/libflutter_caesium_ffi.so |
            grep -q ' fc_abi_version$'
      - run: dart run tool/build_native.dart --platform android
      - name: Verify Android Native Assets
        run: |
          for library in native/android/*/*.so; do
            readelf --wide --dyn-syms "$library" | grep -q ' fc_abi_version$'
            readelf --wide --dyn-syms "$library" | grep -q ' fc_compress_memory$'
          done
      - name: Test rebuilt Native Asset
        run: flutter test test/native_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-android
          path: |
            native/android
            native/linux
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Test checked-in Native Asset without installing Rust
        run: flutter test test/native_integration_test.dart
      - name: Build Windows consumer without installing Rust
        run: flutter build windows --debug
        working-directory: example
      - name: Initialize MSVC command-line tools
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify checked-in Windows Native Asset
        shell: pwsh
        run: |
          $exports = dumpbin /EXPORTS native\windows\x64\flutter_caesium_ffi.dll
          $exportText = $exports -join "`n"
          if ($exportText -notmatch "fc_abi_version") { throw "Missing fc_abi_version" }
          if ($exportText -notmatch "fc_compress_memory") { throw "Missing fc_compress_memory" }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - run: dart run tool/build_native.dart --platform windows
      - name: Test rebuilt Native Asset
        run: flutter test test/native_integration_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native/windows
          if-no-files-found: error

  package:
    needs: [native-quality, apple, linux-android, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-apple
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-android
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native/windows
      - name: Refresh packaged Native Asset checksums
        run: |
          find native -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
            -print | sort | xargs sha256sum > NATIVE_CHECKSUMS.sha256
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare clean combined package snapshot
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions \
              -c user.email=github-actions@github.com \
              commit -m "Validate rebuilt Native Assets"
          fi
      - run: dart pub publish --dry-run
      - name: Create and enforce package size limits
        run: |
          package_version=$(sed -n 's/^version: //p' pubspec.yaml)
          archive="$RUNNER_TEMP/flutter_caesium_ffi-$package_version.tar.gz"
          tar --exclude-vcs --exclude-from=.pubignore -czf "$archive" .
          compressed=$(stat -c %s "$archive")
          unpacked=$(tar -tzvf "$archive" | awk '{sum += $3} END {print sum}')
          test "$compressed" -lt 104857600
          test "$unpacked" -lt 268435456
          cp "$archive" .
      - uses: actions/upload-artifact@v4
        with:
          name: flutter_caesium_ffi-package
          path: flutter_caesium_ffi-*.tar.gz
          if-no-files-found: error
