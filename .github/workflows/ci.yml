name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.22.2

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib
      - run: flutter analyze
      - run: flutter test test/models_test.dart
      - run: flutter test --platform chrome test/web_validation_test.dart
      - run: flutter build web --release
        working-directory: example
      - name: Verify bundled WebAssembly assets
        run: sha256sum -c WEB_CHECKSUMS.sha256
      - name: Verify bundled native binaries
        run: sha256sum -c NATIVE_CHECKSUMS.sha256
