name: Compression parity

on:
  workflow_dispatch:
    inputs:
      jpeg_quality:
        description: JPEG quality used on every platform
        required: true
        default: '62'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.22.2
  COMPARISON_QUALITY: ${{ inputs.jpeg_quality }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compress with the bundled Linux library
        env:
          FLUTTER_CAESIUM_FFI_LIBRARY: ${{ github.workspace }}/native/linux/x64/libflutter_caesium_ffi.so
        run: >-
          dart run tool/compress_fixture.dart
          example/assets/comparison/input.jpeg
          "$RUNNER_TEMP/comparison/linux.jpeg"
          linux
          "$COMPARISON_QUALITY"
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-linux
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compress with the bundled Windows library
        shell: pwsh
        run: |
          $env:FLUTTER_CAESIUM_FFI_LIBRARY = "${{ github.workspace }}\native\windows\x64\flutter_caesium_ffi.dll"
          dart run tool/compress_fixture.dart `
            example/assets/comparison/input.jpeg `
            "$env:RUNNER_TEMP\comparison\windows.jpeg" `
            windows `
            "$env:COMPARISON_QUALITY"
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-windows
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Compress with the bundled macOS XCFramework
        working-directory: example
        env:
          COMPARISON_OUTPUT: ${{ runner.temp }}/comparison/macos.jpeg
        run: >-
          flutter drive
          --driver=test_driver/compression_parity_driver.dart
          --target=integration_test/compression_parity_test.dart
          -d macos
          --dart-define=COMPARISON_PLATFORM=macos
          --dart-define=COMPARISON_QUALITY=$COMPARISON_QUALITY
      - name: Boot an iOS simulator
        id: simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j |
            jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid')
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Compress with the bundled iOS Simulator XCFramework
        working-directory: example
        env:
          COMPARISON_OUTPUT: ${{ runner.temp }}/comparison/ios.jpeg
        run: >-
          flutter drive
          --driver=test_driver/compression_parity_driver.dart
          --target=integration_test/compression_parity_test.dart
          -d "${{ steps.simulator.outputs.id }}"
          --dart-define=COMPARISON_PLATFORM=ios
          --dart-define=COMPARISON_QUALITY=$COMPARISON_QUALITY
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-apple
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compress with the bundled Android x86_64 library
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          script: >-
            cd example &&
            COMPARISON_OUTPUT="$RUNNER_TEMP/comparison/android.jpeg"
            flutter drive
            --driver=test_driver/compression_parity_driver.dart
            --target=integration_test/compression_parity_test.dart
            -d emulator-5554
            --dart-define=COMPARISON_PLATFORM=android
            --dart-define=COMPARISON_QUALITY=$COMPARISON_QUALITY
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-android
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser driver without downloading a browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/web-tools" playwright@1.47.2
      - name: Compress with the bundled WebAssembly module
        env:
          NODE_PATH: ${{ runner.temp }}/web-tools/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: >-
          node tool/compress_web_fixture.cjs
          example/assets/comparison/input.jpeg
          "$RUNNER_TEMP/comparison/web.jpeg"
          web/libcaesium_wasm/index.js
          web/libcaesium_wasm/libcaesium_wasm.wasm
          "$COMPARISON_QUALITY"
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-web
          path: ${{ runner.temp }}/comparison
          if-no-files-found: error

  report:
    if: ${{ !cancelled() }}
    needs: [linux, windows, apple, android, web]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: comparison-*
          path: comparison-results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0
      - name: Compare encoded files and decoded pixels
        run: |
          python tool/compare_compression_results.py \
            --input example/assets/comparison/input.jpeg \
            --reference example/assets/comparison/cli-reference.jpeg \
            --results comparison-results \
            --json-output comparison-results/report.json \
            --markdown-output comparison-results/report.md
          cp example/assets/comparison/input.jpeg comparison-results/
          cp example/assets/comparison/cli-reference.jpeg comparison-results/
      - uses: actions/upload-artifact@v4
        with:
          name: compression-parity-report
          path: comparison-results
          if-no-files-found: error
